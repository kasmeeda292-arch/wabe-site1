<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>แดชบอร์ดครู | SafeTech</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="header-inner"><div class="logo"><span>🛡️</span>SafeTech ป.5</div><nav class="nav"><a href="index.html">🏠 หน้าหลัก</a><a href="manual.html">📖 คู่มือ</a><a class="active" href="login.html">🔐 เข้าสู่ระบบ</a><a href="pretest.html">📝 ก่อนเรียน</a><a href="lessons.html">📚 บทเรียน</a><a href="summary.html">📌 สรุป</a><a href="game.html">🎮 เกม</a><a href="posttest.html">🏆 หลังเรียน</a><a href="creator.html">👩‍💻 ผู้จัดทำ</a></nav></div></header><main class="page-title"><h1>👩‍🏫 แดชบอร์ดครู</h1><p>ดูคะแนนที่บันทึกไว้ในเครื่องนี้</p></main><section class="container"><div class="card"><div id="auth"></div><div class="table-wrap"><table class="score-table"><thead><tr><th>นักเรียน</th><th>ชั้น</th><th>เลขที่</th><th>ก่อนเรียน</th><th>หลังเรียน</th><th>สถานะ</th></tr></thead><tbody id="rows"></tbody></table></div><div class="btn-row"><button class="btn back" onclick="sessionStorage.removeItem('teacherAuth');location.href='teacher-login.html'">ออกจากระบบครู</button><a class="btn" href="index.html">หน้าหลัก</a></div></div></section><script>if(sessionStorage.getItem('teacherAuth')!=='1'){location.href='teacher-login.html'}else{let s=JSON.parse(localStorage.getItem('student')||'null'),pre=localStorage.getItem('pretestScore'),pt=localStorage.getItem('posttestScore'),preT=localStorage.getItem('pretestTotal')||10,ptT=localStorage.getItem('posttestTotal')||10;auth.innerHTML=s?'<div class="notice success">กำลังดูข้อมูลของ '+s.name+'</div>':'<div class="notice">ยังไม่มีข้อมูลนักเรียน</div>';rows.innerHTML=s?'<tr><td>'+s.name+'</td><td>'+s.cls+'</td><td>'+s.no+'</td><td>'+(pre??'-')+' / '+preT+'</td><td>'+(pt??'-')+' / '+ptT+'</td><td>'+(pt?'ทำครบแล้ว':'กำลังเรียน')+'</td></tr>':'<tr><td colspan="6">ยังไม่มีข้อมูล</td></tr>'}</script><footer class="footer">🛡️ SafeTech ป.5 · การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย</footer></body></html>
