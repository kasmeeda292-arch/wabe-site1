<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>เกมการศึกษา | SafeTech</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="header-inner"><div class="logo"><span>🛡️</span>SafeTech ป.5</div><nav class="nav"><a href="index.html">🏠 หน้าหลัก</a><a href="manual.html">📖 คู่มือ</a><a href="login.html">🔐 เข้าสู่ระบบ</a><a href="pretest.html">📝 ก่อนเรียน</a><a href="lessons.html">📚 บทเรียน</a><a href="summary.html">📌 สรุป</a><a class="active" href="game.html">🎮 เกม</a><a href="posttest.html">🏆 หลังเรียน</a><a href="creator.html">👩‍💻 ผู้จัดทำ</a></nav></div></header><main class="page-title"><h1>🎮 เกมการศึกษา</h1><p>ภารกิจพิชิต SafeTech — ตอบคำถามให้ครบเพื่อปลดล็อกแบบทดสอบหลังเรียน</p></main><section class="container"><div class="notice" id="gate"></div><div id="game" class="game-board"></div><div class="btn-row"><a class="btn back" href="summary.html">← ย้อนกลับสรุปบทเรียน</a><a class="btn green disabled" id="postBtn" href="#">🔒 ทำเกมให้เสร็จก่อน</a></div></section><script>const ready=localStorage.getItem('lesson1Done')==='1'&&localStorage.getItem('lesson2Done')==='1'&&localStorage.getItem('lesson3Done')==='1';if(!ready){gate.className='notice error';gate.textContent='กรุณาเรียนให้ครบทั้ง 3 เรื่องและดูสรุปบทเรียนก่อนเล่นเกม';document.getElementById('game').style.display='none'}else{gate.className='notice success';gate.textContent='เริ่มภารกิจได้เลย! ตอบให้ครบทุกข้อ';const data=[['ข้อ 1','ก่อนส่งข้อความออนไลน์ควรทำสิ่งใด?',['คิดและตรวจข้อความก่อนส่ง','ส่งทันที','ใช้คำหยาบ','เผยแพร่ต่อทันที'],0],['ข้อ 2','เมื่อเห็นความคิดเห็นต่างจากเรา ควรทำอย่างไร?',['เคารพและตอบอย่างสุภาพ','ล้อเลียน','โกรธและด่ากลับ','เผยแพร่ข้อมูลส่วนตัว'],0],['ข้อ 3','หากพบลิงก์น่าสงสัยควรทำอย่างไร?',['ไม่กดและตรวจสอบก่อน','กดทันที','กรอกข้อมูลทันที','ส่งต่อให้ทุกคน'],0],['ข้อ 4','ข้อมูลใดควรระวังเป็นพิเศษ?',['ข้อมูลส่วนตัวและรหัสผ่าน','สีที่ชอบ','ชื่อวิชา','จำนวนดินสอ'],0],['ข้อ 5','การเผยแพร่ข่าวโดยไม่ตรวจสอบอาจทำให้เกิดอะไร?',['ข้อมูลผิดถูกส่งต่อ','อินเทอร์เน็ตเร็วขึ้น','เครื่องชาร์จเร็วขึ้น','หน้าจอสว่างขึ้น'],0],['ข้อ 6','มารยาทออนไลน์ที่ดีคืออะไร?',['คิดถึงความรู้สึกผู้อื่น','รบกวนผู้อื่นตลอดเวลา','ส่งสแปม','ใช้คำหยาบ'],0]];let done=0;data.forEach((x,k)=>{const d=document.createElement('div');d.className='game-card';d.innerHTML='<h3>'+x[0]+' · '+x[1]+'</h3>'+x[2].map((o,i)=>'<button data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('');d.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(d.dataset.done)return;d.dataset.done='1';let i=+b.dataset.i;if(i===x[3]){b.classList.add('correct');done++;}else{b.classList.add('wrong');d.querySelectorAll('button')[x[3]].classList.add('correct');done++;}if(done===data.length){localStorage.setItem('gameDone','1');postBtn.classList.remove('disabled');postBtn.href='posttest.html';postBtn.textContent='ไปแบบทดสอบหลังเรียน →';gate.textContent='🎉 ผ่านภารกิจเกมการศึกษาแล้ว สามารถทำแบบทดสอบหลังเรียนได้';gate.className='notice success'}});game.appendChild(d)})}</script><footer class="footer">🛡️ SafeTech ป.5 · การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย</footer></body></html>
