<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>นักเรียน | SafeTech</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="header-inner"><div class="logo"><span>🛡️</span>SafeTech ป.5</div><nav class="nav"><a href="index.html">🏠 หน้าหลัก</a><a href="manual.html">📖 คู่มือ</a><a class="active" href="login.html">🔐 เข้าสู่ระบบ</a><a href="pretest.html">📝 ก่อนเรียน</a><a href="lessons.html">📚 บทเรียน</a><a href="summary.html">📌 สรุป</a><a href="game.html">🎮 เกม</a><a href="posttest.html">🏆 หลังเรียน</a><a href="creator.html">👩‍💻 ผู้จัดทำ</a></nav></div></header><main class="page-title"><h1>👨‍🎓 ข้อมูลนักเรียน</h1><p>กรอกข้อมูลให้ครบก่อนเริ่มแบบทดสอบก่อนเรียน</p></main><section class="container"><div class="card form-card"><form id="studentForm"><div class="field"><label>ชื่อ–นามสกุล</label><input id="studentName" required placeholder="เช่น เด็กชายใจดี รักเรียน"></div><div class="field"><label>ชั้น</label><select id="studentClass" required><option value="">เลือกชั้น</option><option>ป.5/1</option><option>ป.5/2</option><option>ป.5/3</option><option>ป.5/4</option></select></div><div class="field"><label>เลขที่</label><input id="studentNo" type="number" min="1" required placeholder="เลขที่"></div><div class="btn-row"><button class="btn green" type="submit">บันทึกข้อมูลและไปก่อนเรียน →</button></div></form><div id="msg"></div></div><div class="btn-row"><a class="btn back" href="login.html">← ย้อนกลับเข้าสู่ระบบ</a></div></section><script>document.getElementById('studentForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('student',JSON.stringify({name:studentName.value.trim(),cls:studentClass.value,no:studentNo.value}));location.href='pretest.html'});</script><footer class="footer">🛡️ SafeTech ป.5 · การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย</footer></body></html>
